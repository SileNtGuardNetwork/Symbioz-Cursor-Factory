name: Feature request
description: Propose a focused improvement to the Factory.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or workflow problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not only the implementation idea.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cursor Rules
        - Agent Skills
        - MCP profiles
        - Installation
        - Validation or CI
        - SaaS template
        - Documentation
        - Security
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or use case
      description: Explain where this was needed and whether it has been tested in a real project.
  - type: textarea
    id: risks
    attributes:
      label: Risks and permissions
      description: Note required scopes, external services, costs, destructive actions, or security implications.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request solves a reusable problem and is not only product-specific.
          required: true
        - label: I understand that unverified integrations and broad universal claims are out of scope.
          required: true
