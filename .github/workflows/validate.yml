name: Validate Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - 'foundation/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Validate foundation and environment
        run: npm run verify

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-validation-report
          path: validation-report.txt
          if-no-files-found: error
          retention-days: 14
